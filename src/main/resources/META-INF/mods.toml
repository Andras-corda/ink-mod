# Metadonnees du mod. Les ${...} sont remplis au build depuis gradle.properties.
modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

# issueTrackerURL="https://example.com/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''
# logoFile="${mod_id}.png"
# credits="Merci a tous"
# displayURL="https://example.com"

[[dependencies.${mod_id}]]
    modId="forge"
    type="required"
    versionRange="${forge_version_range}"
    ordering="NONE"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"
